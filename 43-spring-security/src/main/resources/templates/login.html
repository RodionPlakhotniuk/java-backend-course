<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Registration and Login System</a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header fs-3">Login</div>
                <div class="card-body">

                    <div th:if="${param.registered}" class="alert alert-success">Реєстрація успішна. Увійдіть, будь
                        ласка.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger">Невірний email або пароль.</div>
                    <div th:if="${param.logout}" class="alert alert-info">Ви вийшли із системи.</div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3"><label class="form-label">Email</label>
                            <input class="form-control" name="username" placeholder="rodion@gmail.com"/></div>
                        <div class="mb-4"><label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password"/></div>
                        <button class="btn btn-primary w-100">Login</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
