<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Registered Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Registration and Login System</a>
        <ul class="navbar-nav ms-auto flex-row">
            <li class="nav-item me-3"><a class="nav-link text-white" th:href="@{/registration}">Register</a></li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-link nav-link text-white">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div class="container my-4">
    <h2>Registered Users</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="table-info">
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}">Rodion</td>
            <td th:text="${u.phone}">38 000-111-22-33</td>
            <td th:text="${u.email}">rodion@gmail.com</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
