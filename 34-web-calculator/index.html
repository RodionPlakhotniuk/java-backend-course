<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .display {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            min-height: 40px;
            word-wrap: break-word;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #e3e3e3;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #ccc;
        }
        .operator {
            background: #ffd966;
        }
        .equal {
            background: #a6e22e;
        }
        .clear, .backspace {
            background: #f67280;
        }
    </style>
</head>
<body>
<div class="calculator">
    <div class="display" id="display"></div>
    <div class="buttons">
        <button class="clear">C</button>
        <button class="backspace">←</button>
        <button class="operator">/</button>
        <button class="operator">*</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">-</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">+</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="equal">=</button>
        <button style="grid-column: span 2">0</button>
        <button>.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let expression = '';

    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
            const value = button.textContent;

            if (value === 'C') {
                expression = '';
            } else if (value === '←') {
                expression = expression.slice(0, -1);
            } else if (value === '=') {
                try {
                    const result = eval(expression);
                    expression = result === Infinity || isNaN(result) ? 'Помилка' : result.toString();
                } catch {
                    expression = 'Помилка';
                }
            } else {
                expression += value;
            }

            display.textContent = expression;
        });
    });
</script>
</body>
</html>
